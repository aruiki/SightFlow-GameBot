[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sightflow"
version = "0.1.0"
description = "Object detectors + human-written rule flows for game automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "opencv-python", "pyyaml", "mss", "pynput"]

[project.optional-dependencies]
yolo = ["ultralytics"]
demo = ["pygame"]
dev = ["pytest", "pygame"]

[project.scripts]
sightflow = "sightflow.cli:main"

[tool.setuptools]
packages = ["sightflow"]
